<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Reeldex app icon. Green = productivity; warm ring around the play button
       nods to Instagram reels without copying its glyph; the card + checklist = notes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16C172"/>
      <stop offset="1" stop-color="#0A6E3F"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FEDA75"/>
      <stop offset="0.35" stop-color="#FA7E1E"/>
      <stop offset="0.65" stop-color="#D62976"/>
      <stop offset="1" stop-color="#962FBF"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FD07F"/>
      <stop offset="1" stop-color="#0B7A45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#043A20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="860" cy="150" r="260" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="140" cy="930" r="220" fill="#000000" opacity="0.06"/>

  <!-- stack of notes -->
  <rect x="262" y="206" width="520" height="640" rx="70" fill="#FFFFFF" opacity="0.28" transform="rotate(-9 522 526)"/>
  <rect x="252" y="196" width="520" height="640" rx="70" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- reel badge -->
  <circle cx="512" cy="372" r="112" fill="none" stroke="url(#reel)" stroke-width="22"/>
  <circle cx="512" cy="372" r="86" fill="url(#play)"/>
  <path d="M488 326 L488 418 L566 372 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>

  <!-- checklist -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="322" y="540" width="56" height="56" rx="16" fill="#16C172"/>
    <path d="M336 568 L347 580 L366 556" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="414" y1="568" x2="700" y2="568" stroke="#CFE9DB" stroke-width="26"/>

    <rect x="322" y="630" width="56" height="56" rx="16" fill="#16C172"/>
    <path d="M336 658 L347 670 L366 646" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="414" y1="658" x2="650" y2="658" stroke="#CFE9DB" stroke-width="26"/>

    <rect x="322" y="720" width="56" height="56" rx="16" fill="none" stroke="#B8DCC8" stroke-width="8"/>
    <line x1="414" y1="748" x2="600" y2="748" stroke="#E3F2EA" stroke-width="26"/>
  </g>
</svg>
