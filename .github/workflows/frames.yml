# Started by the `ingest` Edge Function (repository_dispatch) when Gemini picked
# key frames. Cuts them with ffmpeg; see tools/frames/extract-frames.mjs.
name: Extract frames

on:
  repository_dispatch:
    types: [extract-frames]

permissions:
  contents: read

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/frames

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg if missing
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install script dependencies
        run: npm install --prefix tools/frames --no-audit --no-fund

      - name: Cut frames
        # Job id goes through env, never interpolated into the shell command.
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          SUPABASE_URL: https://dlcmgwnrdtpibamzqvpx.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node tools/frames/extract-frames.mjs "$JOB_ID"
